<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">⚖</div>
      <div>
        <h1>Monopolio Legal</h1>
        <p>Gestión Legal · Equipo 4</p>
      </div>
    </div>

    <div class="topbar-right">
      <div class="header-pill" id="teamBadge">
        <span class="live-dot"></span>
        <span id="teamHeader">Sala de juego</span>
      </div>

      <div class="header-pill" title="Tiempo restante de la partida">
        <span>◷</span>
        <span id="hdr">Conectando...</span>
      </div>
    </div>
  </header>

  <div class="offline" id="offline">
    Sin conexión con el servidor. Intentando reconectar...
  </div>

  <main id="app">
    <div class="card card-pad">
      Conectando con el servidor...
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    // ========================================================
    // ESTADO DEL CLIENTE
    // ========================================================

    const $ = (selector) => document.querySelector(selector);

    const esc = (value) =>
      String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);

    const money = (value) =>
      (value < 0 ? '-$' : '$') +
      Math.abs(value).toLocaleString('es-CO');

    const DICE = [
      '',
      '⚀',
      '⚁',
      '⚂',
      '⚃',
      '⚄',
      '⚅'
    ];

    let S = null;
    let team = null;
    let offset = 0;
    let busy = false;
    let err = '';
    let shownSetup = null;
    let diceAnimating = false;
    let animatedDiceFace = 1;
    let awaitingRollAnimation = false;
    let awaitingRollSignature = null;
    let diceAnimationInterval = null;
    let diceAnimationTimeout = null;
    let feedBeforeRoll = null;

    try {
      team = Number(localStorage.getItem('ml_team')) || null;
    } catch (error) {
      team = null;
    }

    // ========================================================
    // CONEXIÓN SOCKET.IO
    // ========================================================

    const sock = io({
      transports: ['websocket', 'polling']
    });

    function rollSignature(game) {
      if (!game || !game.lastMove) return 'sin-lanzamiento';

      const move = game.lastMove;

      return [
        game.turns,
        move.player,
        move.dice,
        move.tile
      ].join(':');
    }

    function startDiceAnimation(move) {
      if (!move || !Number.isFinite(Number(move.dice))) return;

      clearInterval(diceAnimationInterval);
      clearTimeout(diceAnimationTimeout);

      diceAnimating = true;
      animatedDiceFace = 1 + Math.floor(Math.random() * 6);

      // Cada 75 ms muestra una cara aleatoria del dado.
      diceAnimationInterval = setInterval(() => {
        animatedDiceFace = 1 + Math.floor(Math.random() * 6);

        const die = $('#centerDieFace');

        if (die && diceAnimating) {
          die.textContent = DICE[animatedDiceFace];
        }
      }, 75);

      // La duración visual de la tirada es de 2 segundos.
      diceAnimationTimeout = setTimeout(() => {
        clearInterval(diceAnimationInterval);

        diceAnimating = false;
        animatedDiceFace = Number(move.dice);

        feedBeforeRoll = null;
        // Renderiza la cara final que decidió el servidor.
        render();
        updateLiveClocks();
      }, 2000);
    }

    sock.on('connect', () => {
      $('#offline').style.display = 'none';

      if (team) {
        sock.emit('join', { team });
      }
    });

    sock.on('disconnect', () => {
      $('#offline').style.display = 'block';
    });

    sock.on('connect_error', () => {
      $('#offline').style.display = 'block';
    });

    sock.on('state', (state) => {
      S = state;

      offset = Number(state.now || Date.now()) - Date.now();
      busy = false;

      if (awaitingRollAnimation && S.game) {
        const signature = rollSignature(S.game);

        if (
          S.game.lastMove &&
          signature !== awaitingRollSignature
        ) {
          awaitingRollAnimation = false;
          awaitingRollSignature = null;

          startDiceAnimation(S.game.lastMove);
        } else if (
          S.game.phase !== 'roll' &&
          S.game.pending &&
          S.game.pending.kind === 'question'
        ) {
          // Si el jugador estaba en Sanción, se genera
          // una pregunta, pero no se ha tirado ningún dado.
          awaitingRollAnimation = false;
          awaitingRollSignature = null;
        }
      }

      render();
      updateLiveClocks();
    });

    // ========================================================
    // SELECCIÓN DE EQUIPO
    // ========================================================

    function pickTeam(number) {
      team = Number(number);
      err = '';
      shownSetup = null;

      try {
        localStorage.setItem('ml_team', team);
      } catch (error) { }

      sock.emit('join', { team });
    }

    function leaveTeam() {
      if (!confirm('¿Cambiar de equipo en este celular?')) {
        return;
      }

      team = null;
      err = '';
      busy = false;
      shownSetup = null;

      try {
        localStorage.removeItem('ml_team');
      } catch (error) { }

      render();
    }

    // ========================================================
    // CREACIÓN DE LA PARTIDA
    // ========================================================

    function setup(event) {
      event.preventDefault();

      const names = [
        ...document.querySelectorAll('.nm-in')
      ]
        .map((input) => input.value.trim())
        .filter(Boolean);

      err = '';

      sock.emit('setup', { team, names }, (response) => {
        if (response && response.error) {
          err = response.error;
          render();
        }
      });
    }

    // ========================================================
    // ACCIONES GENERALES DEL JUEGO
    // ========================================================

    function action(type, payload = {}) {
      if (busy || !team || diceAnimating) return;

      if (type === 'roll' && S && S.game) {
        feedBeforeRoll = [...S.game.feed];
        awaitingRollAnimation = true;
        awaitingRollSignature = rollSignature(S.game);
      }

      busy = true;
      err = '';

      render();

      sock.emit(
        'action',
        { team, type, payload },
        (response) => {
          if (response && response.error) {
            busy = false;
            err = response.error;
            render();
          }
        }
      );

      // Evita dejar los botones bloqueados indefinidamente
      // si se interrumpe la respuesta del servidor.
      setTimeout(() => {
        if (busy) {
          busy = false;
          render();
        }
      }, 4500);
    }

    // ========================================================
    // PERSONALIZACIÓN DE CADA JUGADOR
    //
    // El servidor recibe una acción "customize" independiente
    // para la ficha o el color seleccionado.
    // ========================================================

    function customize(playerIndex, field, value) {
      if (
        !S ||
        !S.game ||
        !team ||
        !['token', 'color'].includes(field)
      ) {
        return;
      }

      if (!canCustomize(S.game)) {
        err = 'La personalización se cierra después del primer lanzamiento.';
        render();
        return;
      }

      const payload = {
        player: Number(playerIndex)
      };

      payload[field] = value;

      err = '';

      sock.emit(
        'action',
        {
          team,
          type: 'customize',
          payload
        },
        (response) => {
          if (response && response.error) {
            err = response.error;
            render();
          }
        }
      );
    }

    function canCustomize(game) {
      return Boolean(
        S &&
        S.status === 'lobby' &&
        game &&
        game.phase === 'roll' &&
        game.turns === 0 &&
        !game.lastMove &&
        game.dice === null
      );
    }

    function allPlayersReady(game) {
      return Boolean(
        game &&
        game.players.length > 0 &&
        (
          S.status !== 'lobby' ||
          game.players.every(
            (player) => player.tokenChosen && player.colorChosen
          )
        )
      );
    }

    // ========================================================
    // FICHAS
    // ========================================================

    function pieceFor(id) {
      const pieces = S && Array.isArray(S.pieces)
        ? S.pieces
        : [];

      return pieces.find((piece) => piece.id === id) || {
        id: id || 'gavel',
        name: 'Mazo legal',
        symbol: '🔨'
      };
    }

    function tokenShape(id) {
      if (id === 'scales') return 'round';
      if (id === 'shield') return 'diamond';
      if (id === 'star') return 'star';
      return '';
    }

    function tokenAvatar(player) {
      const piece = pieceFor(player.token);
      const shape = tokenShape(player.token);

      if (shape === 'star') {
        return `
          <div class="token-avatar"
               style="background:${esc(player.color)}">
            <span style="display:none">${esc(piece.symbol)}</span>
            ${esc(piece.symbol)}
          </div>
        `;
      }

      return `
        <div class="token-avatar ${shape}"
             style="background:${esc(player.color)}">
          <span>${esc(piece.symbol)}</span>
        </div>
      `;
    }

    function boardToken(player) {
      const piece = pieceFor(player.token);
      const shape = tokenShape(player.token);

      if (shape === 'star') {
        return `
          <span class="board-token star"
                style="background:${esc(player.color)}"
                title="${esc(player.name)} · ${esc(piece.name)}">
            <span style="display:none">${esc(piece.symbol)}</span>
          </span>
        `;
      }

      return `
        <span class="board-token ${shape}"
              style="background:${esc(player.color)}"
              title="${esc(player.name)} · ${esc(piece.name)}">
          <span>${esc(piece.symbol)}</span>
        </span>
      `;
    }

    // ========================================================
    // TEMPORIZADOR GENERAL Y POR PREGUNTA
    // ========================================================

    function formatTime(milliseconds) {
      const seconds = Math.max(
        0,
        Math.ceil(milliseconds / 1000)
      );

      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;

      return (
        String(minutes).padStart(2, '0') +
        ':' +
        String(remainder).padStart(2, '0')
      );
    }

    function timerText() {
      if (!S) {
        return 'Conectando...';
      }

      if (S.status === 'lobby') {
        return 'En espera';
      }

      if (S.status === 'paused') {
        return 'En pausa';
      }

      if (S.status === 'ended') {
        return 'Finalizado';
      }

      if (!S.endsAt) {
        return 'Sin límite';
      }

      const remaining = Math.max(
        0,
        S.endsAt - (Date.now() + offset)
      );

      return formatTime(remaining);
    }

    function questionRemaining(game) {
      if (!game || !game.pending) {
        return 0;
      }

      const pending = game.pending;

      if (pending.kind !== 'question') {
        return 0;
      }

      if (S.status === 'paused') {
        return Math.max(
          0,
          Number(
            pending.remainingMs ??
            S.questionTimeMs ??
            30000
          )
        );
      }

      if (!Number.isFinite(pending.deadlineAt)) {
        return Number(S.questionTimeMs || 30000);
      }

      return Math.max(
        0,
        pending.deadlineAt - (Date.now() + offset)
      );
    }

    function updateLiveClocks() {
      if (diceAnimating) {
        $('#app').querySelectorAll('button').forEach((button) => {
          button.disabled = true;
        });
      }
      if (!S) {
        return;
      }

      const header = $('#hdr');
      const teamHeader = $('#teamHeader');

      if (header) {
        header.textContent = timerText();
      }

      if (teamHeader) {
        teamHeader.textContent = team
          ? `Equipo ${team}`
          : 'Sala de juego';
      }

      const clock = $('[data-question-clock]');

      if (!clock) {
        return;
      }

      const game = S.game;
      const remaining = questionRemaining(game);

      const duration = Number(
        S.questionTimeMs || 30000
      );

      const seconds = Math.ceil(remaining / 1000);
      const value = clock.querySelector('.clock-value');

      if (value) {
        value.textContent = formatTime(remaining);
      }

      const bar = clock.querySelector('.timer-track span');

      if (bar) {
        const percentage = Math.max(
          0,
          Math.min(100, (remaining / duration) * 100)
        );

        bar.style.width = percentage + '%';
      }

      clock.classList.toggle(
        'urgent',
        remaining <= 10000
      );

      if (S.status === 'paused') {
        const label = clock.querySelector('.clock-label');

        if (label) {
          label.textContent = 'Tiempo restante · Pausado';
        }
      }

      // Evita respuestas cuando la cuenta regresiva ya llegó
      // a cero. La validación definitiva la realiza el servidor.
      if (seconds <= 0 && S.status === 'playing') {
        clock
          .closest('.action-card')
          ?.querySelectorAll('[data-answer-button]')
          .forEach((button) => {
            button.disabled = true;
          });
      }
    }

    setInterval(updateLiveClocks, 200);

    // ========================================================
    // DISTRIBUCIÓN SIMÉTRICA DE LAS 24 CASILLAS
    // ========================================================

    const POS = (() => {
      const positions = {};

      for (let i = 0; i < 7; i++) {
        positions[i] = [0, i];
      }

      for (let i = 7; i < 13; i++) {
        positions[i] = [i - 6, 6];
      }

      for (let i = 13; i < 19; i++) {
        positions[i] = [6, 18 - i];
      }

      for (let i = 19; i < 24; i++) {
        positions[i] = [24 - i, 0];
      }

      return positions;
    })();

    const SPECIAL_ICONS = {
      inicio: '🏁',
      evento: '📣',
      demanda: '⚖️',
      sancion: '🚨',
      vaya_sancion: '🚨',
      diagnostico: '🔎',
      cafe: '☕',
      recorte: '📉'
    };

    function boardHtml(game) {
      let html = '<div class="board">';

      const lastMove = game.lastMove;
      const roller = lastMove
        ? game.players[lastMove.player]
        : null;

      const visibleFace = diceAnimating
        ? animatedDiceFace
        : game.dice;

      const rollInfo = diceAnimating
        ? 'El dado está girando...'
        : lastMove && roller
          ? `${roller.name} sacó ${lastMove.dice}`
          : 'Esperando el lanzamiento';

      S.board.forEach((tile, index) => {
        const position = POS[index];
        if (!position) return;

        const [row, column] = position;
        const owner = game.owners[index];
        const ownerPlayer = owner
          ? game.players[owner.player]
          : null;

        const isProject = tile.type === 'proyecto';

        const tileClass = isProject
          ? `project area-${tile.area}`
          : `sp ${tile.type}`;

        const tokens = game.players
          .filter((player) => player.pos === index)
          .map((player) => boardToken(player))
          .join('');

        const icon = isProject
          ? '⚖️'
          : (SPECIAL_ICONS[tile.type] || '•');

        html += `
      <div class="cell ${tileClass}"
           style="grid-row:${row + 1};grid-column:${column + 1}"
           title="${esc(tile.name)}">

        <span class="tile-icon">${icon}</span>

        <span class="tile-title">
          ${esc(tile.short || tile.name)}
        </span>

        ${isProject
            ? `<span class="tile-price">${money(tile.price)}</span>`
            : ''
          }

        ${ownerPlayer
            ? `<div class="ownership"
                    style="background:${esc(ownerPlayer.color)}"
                    title="Propietario: ${esc(ownerPlayer.name)}"></div>`
            : ''
          }

        ${owner && owner.offices
            ? `<div class="houses ${owner.offices >= 2 ? 'blindada' : ''}"
          title="${owner.offices >= 2 ? 'Propiedad blindada' : 'Una oficina'}">
       ${Array.from(
              { length: Math.min(2, owner.offices) },
              () => '<span class="house"></span>'
            ).join('')}
     </div>`
            : ''
          }

        <div class="tokens">${tokens}</div>
      </div>
    `;
      });

      html += `
    <div class="board-center">
      <div class="center-symbol">⚖</div>

      <div>
        <h2 class="center-title">MONOPOLIO<br>LEGAL</h2>

        <p class="center-subtitle">
          Gestiona proyectos, responde desafíos y
          construye tu estrategia legal.
        </p>
      </div>

      <div id="centerDieFace"
           class="center-dice ${diceAnimating ? 'rolling' : ''}">
        ${visibleFace ? DICE[visibleFace] : '🎲'}
      </div>

      <div id="centerRollInfo" class="center-roll-info">
        ${esc(rollInfo)}
      </div>
    </div>
  `;

      html += '</div>';
      return html;
    }


    // ========================================================
    // TARJETAS DE JUGADORES
    // ========================================================

    function playersHtml(game) {
      return `
        <section class="card players-card">
          <div class="section-heading">
            <div>
              <h2>Participantes</h2>
              <p>Dinero, estadísticas y turno actual.</p>
            </div>

            <span class="badge">
              ${game.players.length} jugadores
            </span>
          </div>

          <div class="players-grid">
            ${game.players.map((player, index) => {
        const isTurn =
          index === game.turn &&
          game.phase !== 'ended';

        const piece = pieceFor(player.token);

        return `
                <article class="player-card ${isTurn ? 'turn' : ''}">
                  <div class="player-top">
                    ${tokenAvatar(player)}

                    <div class="player-heading">
                      <span class="player-name">
                        ${esc(player.name)}
                      </span>

                      <span class="player-position">
                        Casilla ${player.pos + 1}
                      </span>

                      ${player.jailed
            ? '<span class="badge red" style="margin-top:6px">En sanción</span>'
            : ''
          }
                    </div>
                  </div>

                  <div class="player-money ${player.money < 0 ? 'negative' : ''}">
                    ${money(player.money)}
                  </div>

                  <div class="player-stats">
                    <span class="player-stat">
                      ✓ ${player.correct}
                    </span>

                    <span class="player-stat">
                      ✕ ${player.wrong}
                    </span>

                    <span class="player-stat">
                      ◆ ${player.pistas || 0}
                    </span>
                  </div>

                  <div class="player-stats">
                    <span class="player-stat">
                      🏢 ${game.players[index].patrimonio !== undefined
            ? money(game.players[index].patrimonio)
            : money(player.money)}
                    </span>
                  </div>

                  ${isTurn
            ? '<span class="player-status">● Turno actual</span>'
            : ''
          }

                  <span class="player-position" style="margin-top:8px">
                    ${esc(piece.name)}
                  </span>
                </article>
              `;
      }).join('')}
          </div>
        </section>
      `;
    }

    // ========================================================
    // SELECTORES DE FICHAS Y COLORES
    // ========================================================


    function pieceOwner(game, pieceId, currentIndex) {
      return game.players.find((player, index) =>
        index !== currentIndex &&
        player.tokenChosen &&
        player.token === pieceId
      ) || null;
    }

    function colorOwner(game, colorHex, currentIndex) {
      return game.players.find((player, index) =>
        index !== currentIndex &&
        player.colorChosen &&
        String(player.color).toLowerCase() ===
        String(colorHex).toLowerCase()
      ) || null;
    }



    function customizationHtml(game) {
      // La personalización solo existe durante la sala de espera.
      if (!canCustomize(game)) {
        return '';
      }

      const ready = allPlayersReady(game);

      return `
    <section class="card customization-card">
      <div class="section-heading">
        <div>
          <h2>Personaliza tu ficha</h2>
          <p>Cada integrante debe elegir una ficha y un color únicos.</p>
        </div>

        <span class="badge ${ready ? 'green' : 'gold'}">
          ${ready ? 'Completado' : 'Pendiente'}
        </span>
      </div>

      <div class="customization-intro">
        Las fichas y los colores elegidos quedan reservados.
        Los demás participantes no podrán seleccionar los mismos.
        Una vez que el moderador inicie el juego, la personalización
        se cerrará.
      </div>

      ${game.players.map((player, index) => {
        const selectedPiece = Boolean(player.tokenChosen);
        const selectedColor = Boolean(player.colorChosen);

        const playerReady = selectedPiece && selectedColor;

        return `
          <div class="custom-player">
            <div class="custom-player-heading">
              <span class="custom-number">${index + 1}</span>

              <strong>${esc(player.name)}</strong>

              <span class="badge ${playerReady ? 'green' : 'gold'}">
                ${playerReady ? 'Listo' : 'Elegir'}
              </span>
            </div>

            <div class="custom-controls">
              <div>
                <label class="field-label" for="piece-${index}">
                  Tipo de ficha
                </label>

                <select
                  class="field-select"
                  id="piece-${index}"
                  onchange="customize(${index}, 'token', this.value)"
                >
                  <option
                    value=""
                    disabled
                    ${selectedPiece ? '' : 'selected'}
                  >
                    Elige una ficha
                  </option>

                  ${(S.pieces || []).map((piece) => {
          const otherOwner = pieceOwner(
            game,
            piece.id,
            index
          );

          const isMine =
            selectedPiece &&
            player.token === piece.id;

          const disabled =
            Boolean(otherOwner) && !isMine;

          let label = `${piece.symbol} ${piece.name}`;

          if (otherOwner) {
            label += ` — elegida por ${otherOwner.name}`;
          }

          return `
                      <option
                        value="${esc(piece.id)}"
                        ${disabled ? 'disabled' : ''}
                        ${isMine ? 'selected' : ''}
                      >
                        ${esc(label)}
                      </option>
                    `;
        }).join('')}
                </select>
              </div>

              <div>
                <span class="field-label">Color</span>

                <div class="color-options">
                  ${(S.colors || []).map((color) => {
          const otherOwner = colorOwner(
            game,
            color.hex,
            index
          );

          const isMine =
            selectedColor &&
            player.color.toLowerCase() ===
            color.hex.toLowerCase();

          const disabled =
            Boolean(otherOwner) && !isMine;

          let title = color.name;

          if (otherOwner) {
            title = `Elegido por ${otherOwner.name}`;
          }

          return `
                      <button
                        type="button"
                        class="color-choice
                          ${isMine ? 'selected' : ''}
                          ${otherOwner ? 'taken' : ''}"
                        title="${esc(title)}"
                        aria-label="Elegir color ${esc(color.name)}"
                        ${disabled ? 'disabled' : ''}
                        onclick="customize(
                          ${index},
                          'color',
                          '${esc(color.hex)}'
                        )"
                      >
                        <span
                          class="color-swatch"
                          style="background:${esc(color.hex)}"
                        ></span>

                        <span>${esc(color.name)}</span>

                        ${otherOwner
              ? '<span>Ocupado</span>'
              : ''
            }
                      </button>
                    `;
        }).join('')}
                </div>
              </div>
            </div>

            <div class="selection-status">
              <span>
                Ficha: ${selectedPiece ? '✓ Elegida' : 'Pendiente'}
              </span>

              <span>
                Color: ${selectedColor ? '✓ Elegido' : 'Pendiente'}
              </span>
            </div>
          </div>
        `;
      }).join('')}

      <div class="err">${esc(err)}</div>

      ${ready
          ? `
            <div class="feedback good">
              Todos los jugadores tienen una ficha y un color
              diferentes. El equipo está preparado.
            </div>
          `
          : `
            <p class="small muted">
              El primer lanzamiento se habilitará cuando todos
              los participantes hayan completado sus elecciones.
            </p>
          `
        }
    </section>
  `;
    }



    // ========================================================
    // IDENTIFICACIÓN DEL JUGADOR ACTIVO
    // ========================================================

    function whoTag(game, playerIndex, label) {
      const player = game.players[playerIndex];

      if (!player) {
        return '';
      }

      return `
        <div class="who">
          <span class="dot"
                style="background:${esc(player.color)}"></span>

          ${esc(label)} ${esc(player.name)}
        </div>
      `;
    }

    // ========================================================
    // TARJETA DE RESULTADO FINAL
    // ========================================================

    function endedHtml(game) {
      const ranking = game.players
        .map((player) => ({
          ...player,
          patrimonio: player.patrimonio ?? player.money
        }))
        .sort((a, b) => b.patrimonio - a.patrimonio);

      return `
        <section class="card action-card">
          <div class="result-symbol">🏆</div>

          <span class="eyebrow">Partida concluida</span>

          <h2 class="result-heading">
            ¡Fin del Monopolio Legal!
          </h2>

          <p class="action-message">
            La clasificación final se calcula sumando el dinero,
            el valor de los proyectos y el valor de las oficinas.
          </p>

          <div class="ranking-list">
            ${ranking.map((player, index) => `
              <div class="ranking-row">
                <span class="ranking-position">
                  ${index + 1}
                </span>

                ${tokenAvatar(player)}

                <div class="ranking-details">
                  <span class="ranking-name">
                    ${esc(player.name)}
                  </span>

                  <span class="ranking-sub">
                    ${player.correct} aciertos ·
                    ${player.wrong} errores
                  </span>
                </div>

                <span class="ranking-money">
                  ${money(player.patrimonio)}
                </span>
              </div>
            `).join('')}
          </div>

          <p class="small muted">
            Para comenzar otra partida, el moderador debe
            reiniciar el juego desde el panel de administración.
          </p>
        </section>
      `;
    }

    // ========================================================
    // PANTALLA DE ACCIONES
    // ========================================================

    function actionHtml(game) {
      if (
        game.phase === 'ended' ||
        S.status === 'ended'
      ) {
        return endedHtml(game);
      }

      if (S.status === 'paused') {
        const pending = game.pending;

        const pausedQuestion =
          pending && pending.kind === 'question';

        return `
          <section class="card action-card">
            <div class="result-symbol">Ⅱ</div>

            <h2 class="result-heading">
              Juego en pausa
            </h2>

            <p class="action-message">
              El moderador pausó la partida. No se puede
              responder ni realizar movimientos hasta que
              el juego se reanude.
            </p>

            ${pausedQuestion
            ? `
                  <div class="feedback">
                    Tiempo restante de la pregunta:
                    <strong>
                      ${formatTime(
              Number(
                pending.remainingMs ??
                S.questionTimeMs ??
                30000
              )
            )}
                    </strong>
                  </div>
                `
            : ''
          }
          </section>
        `;
      }

      if (S.status === 'lobby') {
        return `
          <section class="card action-card">
            <div class="action-topline">
              <h2>Partida preparada</h2>
              <span class="badge gold">En espera</span>
            </div>

            <p class="action-message">
              El equipo ya está registrado. Cada integrante
              puede seleccionar su ficha y su color antes
              de comenzar.
            </p>

            <div class="feedback">
              El moderador debe presionar
              <strong>Iniciar</strong> desde el panel de
              administración para habilitar los dados.
            </div>
          </section>
        `;
      }

      const player = game.players[game.turn];
      const pending = game.pending;

      if (!player) {
        return `
          <section class="card action-card">
            No se encontró el jugador del turno actual.
          </section>
        `;
      }

      // ------------------------------------------------------
      // TURNO PARA TIRAR DADO
      // ------------------------------------------------------

      if (game.phase === 'roll') {
        const ready = allPlayersReady(game);
        const beforeFirstRoll =
          game.turns === 0 &&
          !game.lastMove &&
          game.dice === null;

        return `
          <section class="card action-card">
            <div class="action-topline">
              <h2>Tu próximo movimiento</h2>
              <span class="badge green">En juego</span>
            </div>

            ${whoTag(game, game.turn, 'Turno de')}

            <p class="action-message">
              ${player.jailed
            ? 'Estás en Sanción. Tendrás que responder una pregunta para salir.'
            : 'Lanza el dado para avanzar por el tablero y resolver la casilla en la que caigas.'
          }
            </p>

            ${beforeFirstRoll && !ready
            ? `
                  <div class="feedback bad">
                    Primero, cada integrante debe seleccionar
                    su ficha y su color en el panel de personalización.
                  </div>
                `
            : ''
          }

            <button class="btn btn-primary"
                    ${busy || !ready ? 'disabled' : ''}
                    onclick="action('roll')">

              ${player.jailed ? 'Responder para salir' : '🎲 Tirar dado'}
            </button>

            ${!ready
            ? `
                  <p class="small muted" style="margin-bottom:0">
                    El primer lanzamiento se habilitará
                    cuando todos hayan elegido ficha y color.
                  </p>
                `
            : ''
          }

            <div class="err">${esc(err)}</div>
          </section>
        `;
      }

      if (!pending) {
        return `
          <section class="card action-card">
            <h2>Esperando acción</h2>
            <p class="action-message">
              Esperando el siguiente estado del juego.
            </p>
          </section>
        `;
      }

      const move = pending.moveText
        ? `<div class="move-message">${esc(pending.moveText)}</div>`
        : '';

      // ------------------------------------------------------
      // PREGUNTA
      // ------------------------------------------------------

      if (pending.kind === 'question') {

        // Ocultar la pregunta mientras se anima el lanzamiento.
        if (diceAnimating) {
          return `
            <section class="card action-card">
              <div class="result-symbol">🎲</div>
              <h2 class="result-heading">Lanzamiento en curso</h2>
              <p class="action-message">
                Espera a que termine la tirada del dado
                para conocer tu desafío legal.
              </p>
            </section>
          `;
        }

        const answeringPlayer = game.players[pending.who];
        const remaining = questionRemaining(game);
        const duration = Number(S.questionTimeMs || 30000);

        const percentage = Math.max(
          0,
          Math.min(100, (remaining / duration) * 100)
        );

        const eliminated = pending.eliminated || [];

        const canHint =
          answeringPlayer &&
          answeringPlayer.pistas > 0 &&
          eliminated.length === 0;

        return `
          <section class="card action-card">
            ${move}

            <div class="action-topline">
              <h2>Desafío legal</h2>
              <span class="badge gold">Pregunta</span>
            </div>

            ${whoTag(game, pending.who, 'Responde')}

            <div class="question-title">${esc(pending.title || '')}</div>

            <div class="question-clock ${remaining <= 10000 ? 'urgent' : ''}"
                 data-question-clock>
              <div class="clock-top">
                <span class="clock-label">Tiempo restante</span>
                <span class="clock-value">${formatTime(remaining)}</span>
              </div>
              <div class="timer-track">
                <span style="width:${percentage}%"></span>
              </div>
            </div>

            <div class="question-text">${esc(pending.text)}</div>

            <div class="options">
              ${pending.options.map((option, i) => `
                <button class="option-button ${eliminated.includes(i) ? 'eliminated' : ''}"
                        data-answer-button
                        ${busy || eliminated.includes(i) ? 'disabled' : ''}
                        onclick="action('answer', {idx:${i}})">
                  <span class="option-letter">${'ABC'[i]}</span>
                  <span>${esc(option)}</span>
                </button>
              `).join('')}
            </div>

            ${canHint
            ? `<button class="btn btn-secondary"
                         style="margin-top:10px"
                         ${busy ? 'disabled' : ''}
                         onclick="action('pista')">
                   ◆ Usar pista (${answeringPlayer.pistas})
                 </button>`
            : ''
          }

            <div class="err">${esc(err)}</div>
          </section>
        `;
      }
      // A partir de aquí continúa todo tu código actual
      // que muestra la pregunta y sus opciones.



      // ------------------------------------------------------
      // RESULTADO DE LA PREGUNTA
      // ------------------------------------------------------

      if (pending.kind === 'result') {
        return `
          <section class="card action-card">
            <div class="result-symbol">
              ${pending.timedOut ? '⏱' : (pending.correct ? '✓' : '✕')}
            </div>

            <span class="badge ${pending.correct ? 'green' : 'red'}">
              ${pending.timedOut
            ? 'Tiempo agotado'
            : (pending.correct ? 'Respuesta correcta' : 'Respuesta incorrecta')
          }
            </span>

            <h2 class="result-heading" style="margin-top:10px">
              ${esc(game.players[pending.who]?.name || 'Jugador')}
            </h2>

            ${pending.timedOut
            ? `
                  <div class="feedback bad">
                    Se agotaron los 30 segundos disponibles
                    para responder esta pregunta.
                  </div>
                `
            : ''
          }

            ${!pending.correct
            ? `
                  <div class="feedback bad">
                    <strong>Tu respuesta:</strong><br>
                    ${esc(pending.chosen)}
                    <br><br>

                    <strong>Respuesta correcta:</strong><br>
                    ${esc(pending.correctText)}
                  </div>
                `
            : ''
          }

            <div class="feedback ${pending.correct ? 'good' : ''}">
              <strong>¿Por qué?</strong><br>
              ${esc(pending.explanation)}
            </div>

            <p class="action-message">
              <strong>${esc(pending.effect)}</strong>
            </p>

            <button class="btn btn-primary"
                    ${busy ? 'disabled' : ''}
                    onclick="action('continue')">
              Continuar
            </button>

            <div class="err">${esc(err)}</div>
          </section>
        `;
      }

      // ------------------------------------------------------
      // INFORMACIÓN
      // ------------------------------------------------------

      if (pending.kind === 'info') {
        return `
          <section class="card action-card">
            ${move}

            <div class="action-topline">
              <h2>${esc(pending.title)}</h2>

              <span class="badge ${pending.tone === 'good'
            ? 'green'
            : pending.tone === 'bad'
              ? 'red'
              : ''
          }">
                Evento
              </span>
            </div>

            <div class="feedback ${pending.tone === 'good'
            ? 'good'
            : pending.tone === 'bad'
              ? 'bad'
              : ''
          }">
              ${esc(pending.text)}
            </div>

            <button class="btn btn-primary"
                    ${busy ? 'disabled' : ''}
                    onclick="action('continue')">
              Continuar
            </button>
          </section>
        `;
      }

      // ------------------------------------------------------
      // COMPRA DE PROYECTO
      // ------------------------------------------------------

      if (pending.kind === 'buy') {
        return `
          <section class="card action-card">
            ${move}

            <div class="action-topline">
              <h2>${esc(pending.title)}</h2>
              <span class="badge green">Oportunidad</span>
            </div>

            <p class="action-message">
              ${esc(pending.text)}
            </p>

            <div class="button-row">
              <button class="btn btn-green"
                      ${busy ? 'disabled' : ''}
                      onclick="action('buy', {yes:true})">
                Comprar
              </button>

              <button class="btn btn-secondary"
                      ${busy ? 'disabled' : ''}
                      onclick="action('buy', {yes:false})">
                No, gracias
              </button>
            </div>
          </section>
        `;
      }

      // ------------------------------------------------------
      // MEJORAR PROYECTO
      // ------------------------------------------------------

      if (pending.kind === 'build') {
        return `
          <section class="card action-card">
            ${move}

            <div class="action-topline">
              <h2>${esc(pending.title)}</h2>
              <span class="badge gold">Mejora</span>
            </div>

            <p class="action-message">
              ${esc(pending.text)}
            </p>

            <div class="button-row">
              <button class="btn btn-green"
                      ${busy ? 'disabled' : ''}
                      onclick="action('build', {yes:true})">
                Construir oficina
              </button>

              <button class="btn btn-secondary"
                      ${busy ? 'disabled' : ''}
                      onclick="action('build', {yes:false})">
                Pasar
              </button>
            </div>
          </section>
        `;
      }

      // ------------------------------------------------------
      // DEMANDA
      // ------------------------------------------------------

      if (pending.kind === 'demanda') {
        return `
          <section class="card action-card">
            ${move}

            <div class="action-topline">
              <h2>${esc(pending.title)}</h2>
              <span class="badge red">Demanda</span>
            </div>

            <p class="action-message">
              ${esc(pending.text)}
            </p>

            <div class="options">
              ${(pending.targets || []).map((tileIndex) => {
          const owner = game.owners[tileIndex];

          if (!owner) {
            return '';
          }

          const ownerPlayer =
            game.players[owner.player];

          return `
                  <button class="option-button"
                          ${busy ? 'disabled' : ''}
                          onclick="action('demanda', {tile:${tileIndex}})">

                    <span class="option-letter">⚖</span>

                    <span>
                      <strong>
                        ${esc(S.board[tileIndex].name)}
                      </strong>
                      <br>
                      <span class="muted">
                        Propietario: ${esc(ownerPlayer.name)}
                      </span>
                    </span>
                  </button>
                `;
        }).join('')}
            </div>

            <button class="btn btn-secondary"
                    style="margin-top:10px"
                    ${busy ? 'disabled' : ''}
                    onclick="action('demanda', {tile:-1})">
              No demandar
            </button>
          </section>
        `;
      }

      return '';
    }

    // ========================================================
    // ÚLTIMOS MOVIMIENTOS
    // ========================================================

    function feedHtml(game) {
      const entries = (diceAnimating && feedBeforeRoll
        ? feedBeforeRoll
        : game.feed
      ).slice(0, 6);

      return `
        <section class="card feed-card">
          <div class="section-heading">
            <div>
              <h3>Últimos movimientos</h3>
              <p>Actividad reciente del equipo.</p>
            </div>

            <span class="badge">
              ${entries.length} registros
            </span>
          </div>

          ${entries.length
          ? `
                <ul class="feed-list">
                  ${entries.map((entry) => `
                    <li class="feed-item">
                      <span class="feed-marker">↗</span>
                      <span>${esc(entry.text)}</span>
                    </li>
                  `).join('')}
                </ul>
              `
          : `
                <p class="small muted">
                  Los movimientos aparecerán aquí al comenzar la partida.
                </p>
              `
        }
        </section>
      `;
    }

    // ========================================================
    // SELECCIÓN DE EQUIPO
    // ========================================================

    function teamPickerHtml() {
      return `
        <div class="team-picker-wrap">
          <section class="card" style="overflow:hidden">
            <div class="team-picker-hero">
              <span class="eyebrow" style="color:#9DE4BE">
                Gestión Legal · Juego didáctico
              </span>

              <h2>Elige tu equipo y comienza a jugar.</h2>

              <p>
                Cada equipo tendrá su propia partida.
                Los integrantes compartirán un celular
                y se turnarán para jugar.
              </p>
            </div>

            <div class="team-picker-content">
              <div class="section-heading">
                <div>
                  <h2>Seleccionar equipo</h2>
                  <p>
                    Si ya habías ingresado, elige el mismo número
                    para recuperar tu partida.
                  </p>
                </div>
              </div>

              <div class="team-grid">
                ${Array.from(
        { length: S.numTeams },
        (_, i) => i + 1
      ).map((number) => {
        const taken =
          (S.teamsTaken || []).includes(number);

        return `
                    <button class="team-option ${taken ? 'taken' : ''}"
                            onclick="pickTeam(${number})">

                      <span class="team-number">
                        ${number}
                      </span>

                      <span class="team-state">
                        ${taken ? 'Reingresar' : 'Disponible'}
                      </span>
                    </button>
                  `;
      }).join('')}
              </div>

              <div class="err">${esc(err)}</div>
            </div>
          </section>
        </div>
      `;
    }

    // ========================================================
    // FORMULARIO DE REGISTRO DE PARTICIPANTES
    // ========================================================

    function setupHtml() {
      return `
        <section class="card card-pad"
                 style="max-width:680px;margin:35px auto">

          <span class="eyebrow">
            Configuración del equipo
          </span>

          <h2 style="margin:8px 0;color:var(--navy);font-size:25px">
            Equipo ${team}: ¿quiénes juegan?
          </h2>

          <p class="muted small">
            Introduce entre dos y cuatro nombres. Después,
            cada integrante podrá elegir su propia ficha y color.
          </p>

          <form onsubmit="setup(event)">
            <div style="display:grid;gap:10px;margin-top:20px">
              <label>
                <span class="field-label">Jugador 1</span>
                <input class="nm-in field-select"
                       style="font-size:13px"
                       maxlength="18"
                       placeholder="Nombre del primer jugador"
                       autocomplete="off"
                       required>
              </label>

              <label>
                <span class="field-label">Jugador 2</span>
                <input class="nm-in field-select"
                       style="font-size:13px"
                       maxlength="18"
                       placeholder="Nombre del segundo jugador"
                       autocomplete="off"
                       required>
              </label>

              <label>
                <span class="field-label">Jugador 3 (opcional)</span>
                <input class="nm-in field-select"
                       style="font-size:13px"
                       maxlength="18"
                       placeholder="Nombre del tercer jugador"
                       autocomplete="off">
              </label>

              <label>
                <span class="field-label">Jugador 4 (opcional)</span>
                <input class="nm-in field-select"
                       style="font-size:13px"
                       maxlength="18"
                       placeholder="Nombre del cuarto jugador"
                       autocomplete="off">
              </label>
            </div>

            <button class="btn btn-primary"
                    style="margin-top:18px"
                    type="submit">
              Crear partida
            </button>
          </form>

          <div class="err">${esc(err)}</div>

          <button class="link-button" onclick="leaveTeam()">
            ← Elegir otro equipo
          </button>
        </section>
      `;
    }

    // ========================================================
    // RENDER PRINCIPAL
    // ========================================================

    function render() {
      const app = $('#app');

      if (!S) {
        return;
      }

      // Paso 1: elegir equipo.
      if (!team) {
        shownSetup = null;
        app.innerHTML = teamPickerHtml();
        updateLiveClocks();
        return;
      }

      const game = S.game;

      // Paso 2: registrar jugadores.
      if (!game) {
        if (
          shownSetup === team &&
          app.querySelector('form')
        ) {
          const errorNode = app.querySelector('.err');

          if (errorNode) {
            errorNode.textContent = err;
          }

          return;
        }

        shownSetup = team;
        app.innerHTML = setupHtml();

        updateLiveClocks();
        return;
      }

      shownSetup = null;

      // Tablero y panel lateral quedan alineados en dos
      // columnas en escritorio. En pantallas pequeñas,
      // CSS los apila para conservar la legibilidad.
      app.innerHTML = `
        <div class="page-heading">
          <div>
            <span class="eyebrow">Partida del equipo ${team}</span>
            <h2>Centro de operaciones legales</h2>
            <p>
              Administra proyectos, responde preguntas y
              construye tu estrategia para ganar.
            </p>
          </div>

          <span class="badge green">
            ${S.status === 'playing'
          ? 'Partida activa'
          : S.status === 'paused'
            ? 'Partida pausada'
            : S.status === 'ended'
              ? 'Partida finalizada'
              : 'Esperando inicio'}
          </span>
        </div>

        <div class="game-layout">
          <section class="board-column">
            <div class="card board-card">
              <div class="board-topline">
                <h2>Tablero de proyectos legales</h2>
                <span>24 casillas · 4 áreas</span>
              </div>

              ${boardHtml(game)}

              <div class="board-legend">
                <span class="legend-item">
                  <span class="legend-dot" style="background:#4E9F5B"></span>
                  Contratos
                </span>

                <span class="legend-item">
                  <span class="legend-dot" style="background:#D1495B"></span>
                  Litigios
                </span>

                <span class="legend-item">
                  <span class="legend-dot" style="background:#3D6FB0"></span>
                  Cumplimiento
                </span>

                <span class="legend-item">
                  <span class="legend-dot" style="background:#E0A526"></span>
                  Información y tecnología
                </span>
              </div>
            </div>
          </section>

          <aside class="side-column">
  ${customizationHtml(game)}
  ${actionHtml(game)}
  ${playersHtml(game)}
  ${feedHtml(game)}
  <button class="link-button" onclick="leaveTeam()">
    Cambiar de equipo en este celular
  </button>
</aside>

        </div>

        <p class="footer-note">
          Monopolio Legal · Equipo 4 · Gestión de Proyectos · Universidad de Caldas
        </p>
      `;

      updateLiveClocks();
    }
  </script>
</body>

</html>
