<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B1F33">
<title>Monopolio Legal</title>
<style>
  :root { --navy:#0B1F33; --ink:#1d2733; --muted:#6b7785; --bg:#F3F5F8; --card:#fff; --line:#E2E7EE; --ok:#2E9E5B; --bad:#D1495B; --gold:#E0A526; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  header { background:var(--navy); color:#fff; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; }
  header b { font-size:16px; letter-spacing:.3px; }
  header .timer { font-variant-numeric: tabular-nums; font-weight:700; background:rgba(255,255,255,.12); padding:4px 10px; border-radius:20px; font-size:14px; }
  main { padding:12px; max-width:520px; margin:0 auto; }
  .card { background:var(--card); border-radius:14px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:12px; }
  h2 { margin:0 0 8px; font-size:18px; }
  p { margin:6px 0; line-height:1.4; }
  .muted { color:var(--muted); font-size:13px; }
  button { font:inherit; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:600; cursor:pointer; width:100%; }
  button:disabled { opacity:.45; }
  .primary { background:var(--navy); color:#fff; }
  .ghost { background:#E9EDF2; color:var(--ink); }
  .okbtn { background:var(--ok); color:#fff; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .teams { display:grid; grid-template-columns: repeat(5, 1fr); gap:8px; }
  .teams button { padding:16px 0; font-size:20px; background:#fff; border:2px solid var(--line); color:var(--navy); }
  .teams button.taken { border-color:var(--gold); }
  .teams small { display:block; font-size:10px; font-weight:500; color:var(--muted); }
  input { width:100%; font:inherit; font-size:16px; padding:12px; border:1.5px solid var(--line); border-radius:10px; margin-bottom:8px; }
  .players { display:grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap:6px; }
  .pl { border-radius:10px; padding:7px 9px; background:#fff; border:2px solid transparent; font-size:13px; }
  .pl.turn { border-color:var(--navy); box-shadow:0 0 0 2px rgba(11,31,51,.12); }
  .pl .nm { font-weight:700; display:flex; align-items:center; gap:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; display:inline-block; }
  .pl .mn { font-variant-numeric: tabular-nums; font-weight:600; }
  .neg { color:var(--bad); }
  .board { display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(7, 1fr); gap:2px; aspect-ratio:1; margin-bottom:12px; }
  .cell { background:#fff; border-radius:4px; position:relative; font-size:8.5px; line-height:1.05; padding:7px 2px 2px; text-align:center; overflow:hidden; color:#33404d; }
  .cell.sp { background:#FFF4E5; font-weight:700; padding-top:3px; }
  .cell .band { position:absolute; left:0; right:0; top:0; height:5px; }
  .cell .own { position:absolute; bottom:1px; left:2px; right:2px; height:4px; border-radius:2px; }
  .cell .off { position:absolute; top:6px; right:1px; font-size:7px; }
  .cell .tok { position:absolute; bottom:6px; left:0; right:0; display:flex; justify-content:center; gap:1px; }
  .cell .tok i { width:9px; height:9px; border-radius:50%; border:1.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); }
  .center { grid-column:2/7; grid-row:2/7; display:flex; flex-direction:column; align-items:center; justify-content:center; background:transparent; text-align:center; }
  .center .dice { font-size:40px; line-height:1; }
  .center .lg { font-weight:800; color:var(--navy); font-size:15px; letter-spacing:.5px; }
  .who { display:inline-flex; align-items:center; gap:6px; background:#EEF2F7; padding:6px 10px; border-radius:20px; font-weight:700; font-size:14px; margin-bottom:8px; }
  .ctx { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .q { font-size:17px; font-weight:700; margin:6px 0 12px; line-height:1.35; }
  .opt { display:block; text-align:left; background:#F3F6FA; border:2px solid var(--line); margin-bottom:8px; font-weight:500; font-size:15px; color:var(--ink); }
  .opt.elim { text-decoration:line-through; opacity:.35; }
  .opt b { color:var(--navy); margin-right:6px; }
  .res { text-align:center; font-size:44px; margin:2px 0; }
  .fb { background:#F3F6FA; border-radius:10px; padding:10px; margin:10px 0; font-size:14px; }
  .fb.bad { background:#FDECEE; } .fb.good { background:#E8F6EE; }
  .move { font-size:13px; background:#FFF8E6; border-radius:8px; padding:7px 9px; margin-bottom:8px; }
  .feed { font-size:12px; color:var(--muted); margin:0; padding-left:16px; }
  .err { color:var(--bad); font-size:13px; min-height:16px; margin-top:6px; text-align:center; }
  .rank div { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }
  .link { background:none; color:var(--muted); font-size:12px; padding:6px; width:auto; font-weight:500; }
  .offline { background:var(--bad); color:#fff; text-align:center; font-size:13px; padding:6px; display:none; }
</style>
</head>
<body>
<header><b>🎲 Monopolio Legal</b><span id="hdr" class="timer"></span></header>
<div class="offline" id="offline">Sin conexión con el servidor… reconectando</div>
<main id="app"><div class="card">Conectando…</div></main>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const money = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('es-CO');
const DICE = ['','⚀','⚁','⚂','⚃','⚄','⚅'];
let shownSetup = null, S = null, team = null, offset = 0, busy = false, err = '';
try { team = Number(localStorage.getItem('ml_team')) || null; } catch (e) {}

const sock = io({ transports: ['websocket', 'polling'] });
sock.on('connect', () => { $('#offline').style.display = 'none'; if (team) sock.emit('join', { team }); });
sock.on('disconnect', () => { $('#offline').style.display = 'block'; });
sock.on('state', (s) => { S = s; offset = s.now - Date.now(); busy = false; render(); });

function pickTeam(t) { team = t; try { localStorage.setItem('ml_team', t); } catch (e) {} sock.emit('join', { team }); }
function leaveTeam() { if (!confirm('¿Cambiar de equipo en este celular?')) return; team = null; try { localStorage.removeItem('ml_team'); } catch (e) {} render(); }
function action(type, payload) {
  if (busy) return; busy = true; err = ''; render();
  sock.emit('action', { team, type, payload }, (r) => { if (r && r.error) { busy = false; err = r.error; render(); } });
  setTimeout(() => { if (busy) { busy = false; render(); } }, 4000);
}
function setup(e) {
  e.preventDefault();
  const names = [...document.querySelectorAll('.nm-in')].map((i) => i.value.trim()).filter(Boolean);
  sock.emit('setup', { team, names }, (r) => { if (r && r.error) { err = r.error; render(); } });
}

function timerText() {
  if (!S) return '';
  if (S.status === 'lobby') return 'Esperando inicio';
  if (S.status === 'paused') return '⏸ Pausa';
  if (S.status === 'ended') return 'Fin del juego';
  if (!S.endsAt) return 'En juego';
  const ms = Math.max(0, S.endsAt - (Date.now() + offset));
  const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
  return `⏱ ${m}:${String(s).padStart(2, '0')}`;
}
setInterval(() => { $('#hdr').textContent = (team ? `Equipo ${team} · ` : '') + timerText(); }, 500);

const POS = (() => { const p = {}; for (let i = 0; i < 7; i++) p[i] = [0, i]; for (let i = 7; i < 13; i++) p[i] = [i - 6, 6]; for (let i = 13; i < 19; i++) p[i] = [6, 18 - i]; for (let i = 19; i < 24; i++) p[i] = [24 - i, 0]; return p; })();
function boardHtml(g) {
  let h = '<div class="board">';
  S.board.forEach((t, i) => {
    const [r, c] = POS[i], o = g.owners[i];
    const toks = g.players.map((p) => (p.pos === i ? `<i style="background:${p.color}"></i>` : '')).join('');
    h += `<div class="cell ${t.type === 'proyecto' ? '' : 'sp'}" style="grid-row:${r + 1};grid-column:${c + 1}">`
      + (t.type === 'proyecto' ? `<div class="band" style="background:${S.areas[t.area].color}"></div>` : '')
      + esc(t.short)
      + (o ? `<div class="own" style="background:${g.players[o.player].color}"></div>` : '')
      + (o && o.offices ? `<span class="off">${o.offices === 2 ? '🛡️' : '🏢'}</span>` : '')
      + `<div class="tok">${toks}</div></div>`;
  });
  h += `<div class="center">${g.dice ? `<div class="dice">${DICE[g.dice]}</div>` : ''}<div class="lg">MONOPOLIO<br>LEGAL</div></div></div>`;
  return h;
}
function playersHtml(g) {
  return '<div class="players" style="margin-bottom:10px">' + g.players.map((p, i) => `
    <div class="pl ${i === g.turn && g.phase !== 'ended' ? 'turn' : ''}">
      <div class="nm"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.jailed ? ' 🚨' : ''}</div>
      <div class="mn ${p.money < 0 ? 'neg' : ''}">${money(p.money)}</div>
      <div class="muted">✅ ${p.correct} · ❌ ${p.wrong}${p.pistas ? ` · 💡${p.pistas}` : ''}</div>
    </div>`).join('') + '</div>';
}
function whoTag(g, i, label) { const p = g.players[i]; return `<div class="who"><span class="dot" style="background:${p.color}"></span>${label} ${esc(p.name)}</div>`; }

function actionHtml(g) {
  const p = g.players[g.turn], pd = g.pending, dis = busy ? 'disabled' : '';
  if (g.phase === 'ended' || S.status === 'ended') {
    const r = g.players.map((x) => x).sort((a, b) => b.patrimonio - a.patrimonio);
    return `<div class="card"><h2>🏆 Fin de la partida</h2><div class="rank">${r.map((x, i) => `<div><span>${['🥇','🥈','🥉','4.'][i]} <span class="dot" style="background:${x.color}"></span> ${esc(x.name)}</span><b>${money(x.patrimonio)}</b></div>`).join('')}</div>
      <p class="muted">Patrimonio = dinero + valor de proyectos + $100 por oficina.</p></div>`;
  }
  if (S.status === 'paused') return `<div class="card"><h2>⏸ Juego en pausa</h2><p>El moderador pausó el juego. Esperen un momento.</p></div>`;
  if (S.status === 'lobby') return `<div class="card"><h2>Listos ✅</h2><p>La partida del equipo ${team} está creada. Esperen a que el moderador inicie el juego.</p></div>`;
  if (g.phase === 'roll') {
    return `<div class="card">${whoTag(g, g.turn, 'Turno de')}
      ${p.jailed ? '<p>Estás en <b>Sanción</b> 🚨. Responde una pregunta para salir.</p>' : '<p>Tira el dado para avanzar por el tablero.</p>'}
      <button class="primary" ${dis} onclick="action('roll')">${p.jailed ? '🚨 Responder para salir' : '🎲 Tirar dado'}</button></div>`;
  }
  if (!pd) return '';
  const move = pd.moveText ? `<div class="move">${esc(pd.moveText)}</div>` : '';
  if (pd.kind === 'question') {
    const w = g.players[pd.who];
    return `<div class="card">${move}${whoTag(g, pd.who, 'Responde:')}
      <div class="ctx">${esc(pd.title)}</div><div class="q">${esc(pd.text)}</div>
      ${pd.options.map((o, i) => `<button class="opt ${pd.eliminated.includes(i) ? 'elim' : ''}" ${dis || pd.eliminated.includes(i) ? 'disabled' : ''} onclick="action('answer',{idx:${i}})"><b>${'ABC'[i]}</b>${esc(o)}</button>`).join('')}
      ${w.pistas > 0 && !pd.eliminated.length ? `<button class="ghost" ${dis} onclick="action('pista')">💡 Usar comodín PISTA (${w.pistas})</button>` : ''}</div>`;
  }
  if (pd.kind === 'result') {
    return `<div class="card"><div class="res">${pd.correct ? '✅' : '❌'}</div>
      <h2 style="text-align:center">${pd.correct ? '¡Correcto!' : 'Incorrecto'} — ${esc(g.players[pd.who].name)}</h2>
      ${pd.correct ? '' : `<div class="fb bad">Respondiste: <i>${esc(pd.chosen)}</i><br><b>Correcta:</b> ${esc(pd.correctText)}</div>`}
      <div class="fb ${pd.correct ? 'good' : ''}">📘 <b>¿Por qué?</b> ${esc(pd.explanation)}</div>
      <p><b>${esc(pd.effect)}</b></p>
      <button class="primary" ${dis} onclick="action('continue')">Continuar</button></div>`;
  }
  if (pd.kind === 'info') {
    return `<div class="card">${move}<h2>${esc(pd.title)}</h2><div class="fb ${pd.tone === 'good' ? 'good' : pd.tone === 'bad' ? 'bad' : ''}">${esc(pd.text)}</div>
      <button class="primary" ${dis} onclick="action('continue')">Continuar</button></div>`;
  }
  if (pd.kind === 'buy') {
    return `<div class="card"><h2>${esc(pd.title)}</h2><p>${esc(pd.text)}</p>
      <div class="row"><button class="okbtn" ${dis} onclick="action('buy',{yes:true})">Comprar</button><button class="ghost" ${dis} onclick="action('buy',{yes:false})">No, gracias</button></div></div>`;
  }
  if (pd.kind === 'build') {
    return `<div class="card">${move}<h2>${esc(pd.title)}</h2><p>${esc(pd.text)}</p>
      <div class="row"><button class="okbtn" ${dis} onclick="action('build',{yes:true})">Construir 🏢</button><button class="ghost" ${dis} onclick="action('build',{yes:false})">Pasar</button></div></div>`;
  }
  if (pd.kind === 'demanda') {
    return `<div class="card">${move}<h2>${esc(pd.title)}</h2><p>${esc(pd.text)}</p>
      ${pd.targets.map((t) => `<button class="opt" ${dis} onclick="action('demanda',{tile:${t}})"><span class="dot" style="background:${g.players[g.owners[t].player].color}"></span> ${esc(S.board[t].name)} <span class="muted">(${esc(g.players[g.owners[t].player].name)})</span></button>`).join('')}
      <button class="ghost" ${dis} onclick="action('demanda',{tile:-1})">No demandar</button></div>`;
  }
  return '';
}

function render() {
  const app = $('#app');
  if (!S) return;
  if (!team) {
    let h = '<div class="card"><h2>¿Cuál es su equipo?</h2><p class="muted">Un celular por equipo. Si ya tenían partida, al elegir su número la recuperan.</p><div class="teams">';
    for (let t = 1; t <= S.numTeams; t++) { const tk = S.teamsTaken.includes(t); h += `<button class="${tk ? 'taken' : ''}" onclick="pickTeam(${t})">${t}<small>${tk ? 'en juego' : 'libre'}</small></button>`; }
    shownSetup = null; app.innerHTML = h + '</div></div>'; return;
  }
  const g = S.game;
  if (!g) {
    if (shownSetup === team && app.querySelector('form')) { app.querySelector('.err').textContent = err; return; }
    shownSetup = team;
    app.innerHTML = `<div class="card"><h2>Equipo ${team}: ¿quiénes juegan?</h2>
      <p class="muted">Escriban el nombre de cada integrante (2 a 4). Se turnan este celular: cuando sea tu turno o te toque responder, te pasan el teléfono.</p>
      <form onsubmit="setup(event)">${[1,2,3,4].map((i) => `<input class="nm-in" maxlength="18" placeholder="Jugador ${i}${i === 4 ? ' (opcional)' : ''}" autocomplete="off">`).join('')}
      <button class="primary" type="submit">Crear partida</button></form><div class="err">${esc(err)}</div>
      <button class="link" onclick="leaveTeam()">← Elegir otro equipo</button></div>`;
    return;
  }
  shownSetup = null;
  app.innerHTML = playersHtml(g) + actionHtml(g) + `<div class="err">${esc(err)}</div>` + boardHtml(g)
    + `<div class="card"><b style="font-size:13px">Últimos movimientos</b><ul class="feed">${g.feed.slice(0, 6).map((f) => `<li>${esc(f.text)}</li>`).join('')}</ul></div>`
    + `<div style="text-align:center"><button class="link" onclick="leaveTeam()">Cambiar de equipo</button></div>`;
}
</script>
</body>
</html>
